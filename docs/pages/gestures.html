<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search all supported gestures in mp_gesture_lib.">
    <title>Search Gestures - MP Gesture Lib</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✋</text></svg>">
</head>

<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <a href="../index.html" style="display: flex; align-items: center; gap: 0.5rem; color: inherit;">
                    <span class="logo-icon">✋</span>
                    MP_Gesture_Lib
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html#about">About</a></li>
                <li><a href="gestures.html" class="active-nav">Gestures</a></li>
                <li><a href="../index.html#usage">Examples</a></li>
                <li><a href="../index.html#api">API</a></li>
            </ul>
            <button class="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="page-padding">
        <section class="container search-section">
            <div class="section-header">
                <h2>Search Gestures</h2>
                <p>Find operations or specific hand gestures supported by the module.</p>
            </div>

            <div class="search-container glass-panel">
                <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="gesture-search" placeholder="Search for 'plus', 'minus', 'equal', '0-10'..." autocomplete="off">
            </div>

            <div id="no-results" class="no-results hidden glass-panel">
                <div class="feature-icon" style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
                <h3>No matching gestures found</h3>
                <p>We couldn't find any gesture matching your search. Try another operation.</p>
            </div>

            <div class="gesture-grid" id="gesture-results">
                <!-- Data populated via JS -->
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="../script.js"></script>
    <script src="gestures.js"></script>
</body>

</html>
